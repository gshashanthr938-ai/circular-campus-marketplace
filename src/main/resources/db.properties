# ============================================================
#  Database configuration
# ============================================================
# DEFAULT: H2 (embedded, zero-install). The app runs with NO setup.
# H2 speaks standard JDBC and runs in MySQL-compatibility mode,
# so the exact same code/SQL also runs on real MySQL.
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/marketplace;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.user=sa
db.password=

# ------------------------------------------------------------
#  To use MySQL instead (as named in the PBL brief):
#  1) Install MySQL.  (The URL below auto-creates the database.)
#  2) Comment out the 4 H2 lines above and uncomment these 4:
# ------------------------------------------------------------
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/campus_marketplace?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
# db.user=root
# db.password=CHANGE_ME
