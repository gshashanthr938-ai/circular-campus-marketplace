<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#e0e7ff"/>
  <g transform="translate(120 60)">
    <!-- ruler -->
    <rect x="-10" y="150" width="190" height="26" rx="4" fill="#f59e0b" transform="rotate(-4 85 163)"/>
    <!-- compass -->
    <g transform="translate(80 20)">
      <circle cx="0" cy="0" r="9" fill="#4338ca"/>
      <rect x="-4" y="6" width="8" height="120" rx="3" fill="#4f46e5" transform="rotate(16 0 6)"/>
      <rect x="-4" y="6" width="8" height="120" rx="3" fill="#7c3aed" transform="rotate(-16 0 6)"/>
      <circle cx="0" cy="0" r="4" fill="#fff"/>
    </g>
    <!-- pencil -->
    <g transform="rotate(28 40 120)">
      <rect x="20" y="40" width="14" height="90" fill="#0ea5e9"/>
      <path d="M20 40 h14 l-7 -16 z" fill="#fbbf24"/>
      <rect x="20" y="126" width="14" height="10" fill="#312e81"/>
    </g>
  </g>
</svg>
