<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" fill="none">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- backdrop blobs -->
  <circle cx="360" cy="90" r="70" fill="#ede9fe"/>
  <circle cx="90" cy="320" r="55" fill="#e0e7ff"/>

  <!-- phone / storefront -->
  <rect x="120" y="60" width="220" height="300" rx="26" fill="#fff" stroke="#e6e8f0" stroke-width="2"/>
  <rect x="120" y="60" width="220" height="66" rx="26" fill="url(#hg)"/>
  <rect x="120" y="104" width="220" height="22" fill="url(#hg)"/>
  <circle cx="150" cy="93" r="7" fill="#fff" opacity=".9"/>
  <rect x="168" y="86" width="120" height="9" rx="4.5" fill="#fff" opacity=".85"/>
  <rect x="168" y="100" width="70" height="7" rx="3.5" fill="#fff" opacity=".6"/>

  <!-- product tiles -->
  <g>
    <rect x="142" y="150" width="84" height="84" rx="14" fill="#eef2ff"/>
    <rect x="160" y="168" width="48" height="40" rx="6" fill="#4f46e5"/>
    <rect x="160" y="168" width="16" height="40" rx="6" fill="#7c3aed"/>
    <rect x="142" y="242" width="84" height="12" rx="6" fill="#e6e8f0"/>
    <rect x="142" y="260" width="54" height="10" rx="5" fill="#eef2ff"/>
  </g>
  <g>
    <rect x="234" y="150" width="84" height="84" rx="14" fill="#fef3c7"/>
    <circle cx="276" cy="192" r="26" fill="#f59e0b"/>
    <path d="M276 178v28M262 192h28" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <rect x="234" y="242" width="84" height="12" rx="6" fill="#e6e8f0"/>
    <rect x="234" y="260" width="54" height="10" rx="5" fill="#eef2ff"/>
  </g>
  <rect x="142" y="288" width="176" height="46" rx="12" fill="url(#hg)"/>
  <rect x="176" y="305" width="108" height="12" rx="6" fill="#fff" opacity=".9"/>

  <!-- floating price tag -->
  <g transform="rotate(-12 372 250)">
    <rect x="330" y="222" width="86" height="56" rx="12" fill="#fff" stroke="#e6e8f0" stroke-width="2"/>
    <circle cx="346" cy="238" r="5" fill="#7c3aed"/>
    <rect x="358" y="234" width="46" height="9" rx="4.5" fill="#0f172a"/>
    <rect x="358" y="250" width="34" height="8" rx="4" fill="#94a3b8"/>
  </g>

  <!-- coins (wallet) -->
  <g transform="translate(60 120)">
    <ellipse cx="0" cy="40" rx="34" ry="12" fill="#fbbf24"/>
    <ellipse cx="0" cy="30" rx="34" ry="12" fill="#f59e0b"/>
    <ellipse cx="0" cy="20" rx="34" ry="12" fill="#fbbf24"/>
    <text x="0" y="26" font-family="Arial" font-size="16" font-weight="700" fill="#7c4a00" text-anchor="middle">&#8377;</text>
  </g>
</svg>
